<!DOCTYPE html>
<!-- Copyright © Amazon.com and Affiliates: This deliverable is considered Developed Content as defined in the AWS Service Terms and the SOW between the parties dated 2026-04-20. -->
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPC PE AI Platform</title>
  <link rel="icon" type="image/png" href="reference/logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary-900: #081E3A;
      --primary-800: #0F2E57;
      --primary-700: #173F73;
      --primary-600: #1F4E91;
      --primary-500: #275DB2;
      --primary-400: #4A7BC7;
      --primary-300: #7FA2D9;
      --primary-200: #B2C7E8;
      --primary-100: #D4DFEE;
      --primary-50: #EEF2F9;
      --gray-900: #0D1117;
      --gray-800: #1C2230;
      --gray-700: #2E3A4E;
      --gray-600: #4A5568;
      --gray-500: #6B7A8F;
      --gray-400: #94A3B8;
      --gray-300: #CBD5E1;
      --gray-200: #E2E8F0;
      --gray-100: #F1F5F9;
      --gray-50: #F8FAFC;
      --success: #3A8C6E;
      --warning: #B07D3A;
      --error: #A04545;
      --info: #3A6A96;
    }

    html,
    body {
      font-family: 'IBM Plex Sans KR', sans-serif;
      color: var(--gray-700);
      background: var(--gray-100);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-width: 1100px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    input,
    textarea,
    select {
      font-family: inherit;
    }

    .mono {
      font-family: 'IBM Plex Mono', monospace;
    }

    /* Top band + Header (공통) */
    .top-band {
      height: 2px;
      background: var(--primary-500);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .app-header {
      width: 100%;
      min-width: 100%;
      height: 52px;
      background: #fff;
      border-bottom: 1px solid var(--gray-200);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 24px;
      position: sticky;
      top: 2px;
      z-index: 99;
    }

    .hdr-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hdr-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hdr-logo img {
      height: 28px;
      width: auto;
      display: block;
    }

    .hdr-sysname {
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-800);
      letter-spacing: -0.01em;
    }

    .hdr-tabs {
      display: flex;
      gap: 4px;
    }

    .hdr-tab {
      height: 52px;
      display: inline-flex;
      align-items: center;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 500;
      color: var(--gray-500);
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }

    .hdr-tab:hover {
      color: var(--gray-700);
    }

    .hdr-tab.active {
      color: var(--primary-500);
      font-weight: 600;
      border-bottom-color: var(--primary-500);
    }

    .hdr-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    /* Dev role toggle (시연용) */
    .role-toggle {
      display: inline-flex; height: 28px;
      border: 1px solid var(--gray-300); border-radius: 4px;
      overflow: hidden; background: #fff;
    }
    .role-toggle button {
      padding: 0 10px; font-size: 11px; font-weight: 500;
      color: var(--gray-500); background: #fff;
      transition: background .15s, color .15s;
    }
    .role-toggle button.is-active {
      background: var(--primary-50); color: var(--primary-700); font-weight: 600;
    }

    /* Badge pulse */
    .notif-bell .badge.pulse::after {
      content: ''; position: absolute; inset: -2px;
      border-radius: 50%;
      background: var(--primary-500);
      opacity: 0.3;
      animation: notif-pulse 2s infinite;
    }
    @keyframes notif-pulse {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .notif-bell {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: var(--gray-700);
      border: 1px solid transparent;
      position: relative;
      transition: background .15s, border-color .15s;
    }

    .notif-bell:hover {
      background: var(--gray-50);
      border-color: var(--gray-200);
    }

    .notif-bell svg {
      width: 16px;
      height: 16px;
    }

    .notif-bell .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--primary-500);
      color: #fff;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      line-height: 1;
    }

    /* Sub-bar — 생성/수정 맥락을 알려주는 breadcrumb 영역 */
    .form-bar {
      width: 100%;
      min-width: 100%;
      background: #fff;
      border-bottom: 1px solid var(--gray-200);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      position: sticky;
      top: 54px;
      /* top-band 2px + app-header 52px */
      z-index: 98;
    }

    .form-bar-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .form-bar-breadcrumb {
      font-size: 12px;
      color: var(--gray-500);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-bar-breadcrumb a {
      color: var(--primary-700);
      transition: color .15s;
    }

    .form-bar-breadcrumb a:hover {
      color: var(--primary-500);
      text-decoration: underline;
    }

    .form-bar-breadcrumb .sep {
      color: var(--gray-300);
    }

    .form-bar h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--gray-800);
      line-height: 1.25;
    }

    /* Buttons */
    .btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background .15s, border-color .15s, color .15s;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .btn i,
    .btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .btn.btn-primary {
      background: var(--primary-500);
      color: #fff;
    }

    .btn.btn-primary:hover {
      background: var(--primary-600);
    }

    .btn.btn-secondary {
      background: #fff;
      border-color: var(--gray-300);
      color: var(--gray-700);
    }

    .btn.btn-secondary:hover {
      background: var(--gray-50);
    }

    .btn.btn-ghost-danger {
      background: #fff;
      border-color: var(--gray-300);
      color: var(--error);
    }

    .btn.btn-ghost-danger:hover {
      background: rgba(160, 69, 69, 0.05);
      border-color: var(--error);
    }

    .btn:disabled,
    .btn.is-disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* Page wrap */
    .page-wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 32px;
    }

    .form-section {
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: 4px;
      padding: 24px 28px;
      margin-bottom: 16px;
    }

    .form-section-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--gray-100);
    }

    .form-section-index {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: var(--primary-50);
      color: var(--primary-700);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .form-section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-800);
    }

    .form-section-desc {
      margin-left: auto;
      font-size: 12px;
      color: var(--gray-500);
    }

    .form-row {
      display: grid;
      gap: 16px;
      margin-bottom: 16px;
    }

    .form-row:last-child {
      margin-bottom: 0;
    }

    .form-row.col-2 {
      grid-template-columns: 1fr 1fr;
    }

    .form-row.col-3 {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-700);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .form-label .required {
      color: var(--error);
      font-weight: 600;
    }

    .form-hint {
      font-size: 12px;
      color: var(--gray-500);
      line-height: 1.5;
    }

    .form-input,
    .form-select,
    .form-textarea {
      height: 40px;
      padding: 0 12px;
      border: 1px solid var(--gray-300);
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      color: var(--gray-800);
      background: #fff;
      outline: none;
      transition: border-color .15s;
    }

    .form-textarea {
      height: auto;
      padding: 10px 12px;
      min-height: 100px;
      resize: vertical;
      line-height: 1.55;
    }

    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      border-color: var(--primary-500);
    }

    .form-input::placeholder,
    .form-textarea::placeholder {
      color: var(--gray-400);
    }

    /* Segmented radio — 유형/상태 같은 enum */
    .seg-group {
      display: inline-flex;
      align-self: flex-start;
      border: 1px solid var(--gray-300);
      border-radius: 4px;
      background: #fff;
      overflow: hidden;
    }

    .seg-group input[type="radio"] {
      display: none;
    }

    .seg-group label {
      padding: 0 16px;
      height: 38px;
      display: inline-flex;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-500);
      border-right: 1px solid var(--gray-300);
      cursor: pointer;
      transition: background .15s, color .15s;
    }

    .seg-group label:last-child {
      border-right: none;
    }

    .seg-group label:hover {
      background: var(--gray-50);
      color: var(--gray-700);
    }

    .seg-group input[type="radio"]:checked+label {
      background: var(--primary-50);
      color: var(--primary-700);
      font-weight: 600;
    }

    .file-drop {
      display: block;
      border: 1.5px dashed var(--gray-300);
      border-radius: 4px;
      padding: 20px;
      text-align: center;
      color: var(--gray-500);
      font-size: 13px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    .file-drop:hover {
      border-color: var(--primary-500);
      background: var(--primary-50);
      color: var(--primary-700);
    }

    .file-drop.has-file {
      border-color: var(--primary-500);
      background: var(--primary-50);
      color: var(--primary-700);
      font-weight: 500;
    }

    .file-drop input[type="file"] {
      display: none;
    }

    .form-action-bar-right {
      display: flex;
      gap: 8px;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1100;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      background: var(--gray-800);
      color: #fff;
      font-size: 13px;
      padding: 12px 16px;
      border-radius: 4px;
      box-shadow: 0 8px 16px rgba(13, 17, 23, 0.2);
      max-width: 480px;
      word-break: keep-all;
    }
  </style>
</head>

<body>
  <div class="top-band"></div>

  <header class="app-header">
    <div class="hdr-left">
      <a href="index.html#/" class="hdr-logo">
        <img src="reference/logo.png" alt="EPC PE Platform">
        <span class="hdr-sysname">EPC PE AI-Platform</span>
      </a>
    </div>
    <nav class="hdr-tabs">
      <a href="index.html#/" class="hdr-tab active">Projects</a>
      <a href="index.html#/templates" class="hdr-tab">Templates</a>
      <a href="index.html#/bot" class="hdr-tab">AI Q&amp;A</a>
    </nav>
    <div class="hdr-right">
      <button class="notif-bell" aria-label="Notifications">
        <i data-lucide="bell"></i>
        <span class="badge pulse">3</span>
      </button>
    </div>
  </header>

  <div class="form-bar">
    <div class="form-bar-left">
      <div class="form-bar-breadcrumb">
        <a href="index.html#/">Projects</a>
        <span class="sep">/</span>
        <span id="crumb-mode">새 프로젝트</span>
      </div>
      <h1 id="form-title">새 프로젝트 추가</h1>
    </div>
    <div class="form-action-bar-right">
      <a href="index.html#/" class="btn btn-secondary">취소</a>
      <button type="button" class="btn btn-primary is-disabled" id="btn-submit">프로젝트 생성</button>
    </div>
  </div>

  <main class="page-wrap">
    <form id="project-form" autocomplete="off">

      <!-- Section 1: 식별 · 분류 -->
      <section class="form-section">
        <div class="form-section-head">
          <span class="form-section-index">1</span>
          <span class="form-section-title">식별 및 분류</span>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label class="form-label">프로젝트 유형 <span class="required">*</span></label>
            <div class="seg-group" role="radiogroup">
              <input type="radio" name="type" id="type-bid" value="견적">
              <label for="type-bid">견적</label>
              <input type="radio" name="type" id="type-exec" value="수행" checked>
              <label for="type-exec">수행</label>
            </div>
          </div>
        </div>

        <div class="form-row col-2">
          <div class="form-field">
            <label class="form-label" for="contract">계약번호 <span class="required">*</span></label>
            <input class="form-input mono" id="contract">
          </div>
          <div class="form-field">
            <label class="form-label" for="budget-code">예산코드</label>
            <input class="form-input mono" id="budget-code">
          </div>
        </div>

        <div class="form-row" id="status-row">
          <div class="form-field">
            <label class="form-label">프로젝트 상태 <span class="required">*</span></label>
            <div class="seg-group" role="radiogroup">
              <input type="radio" name="status" id="status-running" value="진행중" checked>
              <label for="status-running">진행중</label>
              <input type="radio" name="status" id="status-ended" value="완료">
              <label for="status-ended">완료</label>
              <input type="radio" name="status" id="status-canceled" value="취소">
              <label for="status-canceled">취소</label>
            </div>
          </div>
        </div>
      </section>

      <!-- Section 2: 이름 · 발주처 -->
      <section class="form-section">
        <div class="form-section-head">
          <span class="form-section-index">2</span>
          <span class="form-section-title">프로젝트 개요</span>
        </div>

        <div class="form-row col-2">
          <div class="form-field">
            <label class="form-label" for="name">프로젝트 이름 <span class="required">*</span></label>
            <input class="form-input" id="name">
          </div>
          <div class="form-field">
            <label class="form-label" for="client">발주처 <span class="required">*</span></label>
            <input class="form-input" id="client">
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label class="form-label" for="description">프로젝트 설명</label>
            <textarea class="form-textarea" id="description" rows="3"
              ></textarea>
          </div>
        </div>
      </section>

      <!-- Section 3: 기간 -->
      <section class="form-section">
        <div class="form-section-head">
          <span class="form-section-index">3</span>
          <span class="form-section-title">기간</span>
        </div>

        <div class="form-row col-2">
          <div class="form-field">
            <label class="form-label" for="start">착수일 <span class="required">*</span></label>
            <input class="form-input" id="start" type="date">
          </div>
          <div class="form-field">
            <label class="form-label" for="end">완공일 <span class="required">*</span></label>
            <input class="form-input" id="end" type="date">
          </div>
        </div>
      </section>

      <!-- Section 4: 형태 · 지역 · 위치 -->
      <section class="form-section">
        <div class="form-section-head">
          <span class="form-section-index">4</span>
          <span class="form-section-title">형태 · 위치</span>
        </div>

        <div class="form-row col-3">
          <div class="form-field">
            <label class="form-label" for="form-type">프로젝트 형태</label>
            <input class="form-input" id="form-type">
          </div>
          <div class="form-field">
            <label class="form-label" for="region">지역</label>
            <input class="form-input" id="region">
          </div>
          <div class="form-field">
            <label class="form-label" for="location">위치</label>
            <input class="form-input" id="location">
          </div>
        </div>
      </section>

      <!-- Section 5: ITB 업로드 -->
      <section class="form-section">
        <div class="form-section-head">
          <span class="form-section-index">5</span>
          <span class="form-section-title">ITB 업로드 <span class="required">*</span></span>
          <span class="form-section-desc">ITB 업로드 시 후속 산출물 생성이 자동으로 시작됩니다</span>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label class="file-drop" id="itb-drop">
              <i data-lucide="upload"
                style="width: 20px; height: 20px; margin-bottom: 6px; display: block; margin-left: auto; margin-right: auto;"></i>
              <span id="itb-text">클릭 또는 드래그하여 PDF 파일 선택</span>
              <input type="file" id="itb" accept=".pdf">
            </label>
          </div>
        </div>
      </section>

    </form>
  </main>

  <div class="toast-container" id="toast-container"></div>

  <script>
    // ═══ 쿼리 파라미터 파싱 (SPA hash + 직접 진입 모두 지원) ═══
    function getParams() {
      const hashQ = location.hash.split('?')[1] || '';
      const searchQ = location.search.replace(/^\?/, '');
      return new URLSearchParams(hashQ || searchQ);
    }
    const params = getParams();
    // mode 판정 — URL hash path(/projects/edit, /projects/view) 또는 ?mode= 모두 지원
    const hashPath = (location.hash.replace(/^#/, '').split('?')[0]) || location.pathname;
    let mode;
    if (hashPath.endsWith('/projects/view') || params.get('mode') === 'view') mode = 'view';
    else if (hashPath.endsWith('/projects/edit') || params.get('mode') === 'edit') mode = 'edit';
    else mode = 'new';
    const editIdx = params.get('idx') !== null ? Number(params.get('idx')) : null;

    // ═══ 외부(1번 페이지)에서 전달된 현재 프로젝트 정보가 있으면 pre-fill ═══
    // 간단한 mock: sessionStorage에 1번 페이지가 edit/view 시 저장해둔다고 가정
    let prefill = null;
    try {
      const raw = sessionStorage.getItem('projectFormPrefill');
      if (raw && (mode === 'edit' || mode === 'view')) prefill = JSON.parse(raw);
    } catch { }

    // ═══ DOM 참조 ═══
    const crumbMode = document.getElementById('crumb-mode');
    const formTitle = document.getElementById('form-title');
    const btnSubmit = document.getElementById('btn-submit');

    const elType = () => document.querySelector('input[name="type"]:checked')?.value;
    const elStatus = () => document.querySelector('input[name="status"]:checked')?.value;
    const elContract = document.getElementById('contract');
    const elBudget = document.getElementById('budget-code');
    const elName = document.getElementById('name');
    const elClient = document.getElementById('client');
    const elDesc = document.getElementById('description');
    const elStart = document.getElementById('start');
    const elEnd = document.getElementById('end');
    const elFormType = document.getElementById('form-type');
    const elRegion = document.getElementById('region');
    const elLocation = document.getElementById('location');
    const elItb = document.getElementById('itb');
    const itbDrop = document.getElementById('itb-drop');
    const itbText = document.getElementById('itb-text');

    // ═══ 모드별 UI 조정 ═══
    // 새 프로젝트 추가 시 상태 필드 숨김 (기본값 '진행중' 유지)
    if (mode === 'new') {
      const statusRow = document.getElementById('status-row');
      if (statusRow) statusRow.style.display = 'none';
    }
    if (mode === 'edit' || mode === 'view') {
      const titleText = mode === 'view' ? '프로젝트 정보' : '프로젝트 정보 수정';
      const crumbText = mode === 'view' ? (prefill?.name || '프로젝트 보기') : (prefill?.name || '프로젝트 수정');
      crumbMode.textContent = crumbText;
      formTitle.textContent = titleText;
      btnSubmit.textContent = '변경사항 저장';
      if (prefill) {
        // pre-fill
        document.querySelector(`input[name="type"][value="${prefill.type || '수행'}"]`)?.click();
        document.querySelector(`input[name="status"][value="${prefill.status || '진행중'}"]`)?.click();
        elContract.value = prefill.contract || '';
        elBudget.value = prefill.budgetCode || '';
        elName.value = prefill.name || '';
        elClient.value = prefill.client || '';
        elDesc.value = prefill.description || '';
        elStart.value = prefill.start || '';
        elEnd.value = prefill.end || '';
        elFormType.value = prefill.formType || '';
        elRegion.value = prefill.region || '';
        elLocation.value = prefill.location || '';
      }
    }

    // ═══ view 모드 — 모든 입력을 readonly/disabled로, 제출 버튼 숨김 ═══
    if (mode === 'view') {
      // 모든 input/textarea를 disabled
      document.querySelectorAll('#project-form input, #project-form textarea, #project-form select')
        .forEach(el => { el.disabled = true; });
      // ITB 업로드 섹션 숨김 (이미 업로드된 자료를 다시 받지 않음)
      const itbSection = document.querySelector('#itb-drop')?.closest('section.form-section');
      if (itbSection) itbSection.style.display = 'none';
      // 제출 버튼 숨김
      btnSubmit.style.display = 'none';
      // 취소 → 목록으로 돌아가기
      const btnCancel = document.querySelector('.form-action-bar-right .btn-secondary');
      if (btnCancel) btnCancel.textContent = '목록으로';
    }

    // ═══ 제출 활성 검증 ═══
    function updateSubmitState() {
      // edit 모드에서는 기존 ITB가 이미 있다고 가정 → 재첨부 선택
      const itbOk = mode === 'edit' ? true : !!elItb.files[0];
      const ok = elType() && elStatus()
        && elContract.value.trim()
        && elName.value.trim()
        && elClient.value.trim()
        && elStart.value && elEnd.value
        && itbOk;
      btnSubmit.classList.toggle('is-disabled', !ok);
    }
    ['input', 'change'].forEach(ev => {
      document.getElementById('project-form').addEventListener(ev, updateSubmitState);
    });
    updateSubmitState();

    // ═══ ITB 파일 선택 피드백 ═══
    elItb.addEventListener('change', () => {
      const f = elItb.files[0];
      if (f) {
        itbText.textContent = f.name;
        itbDrop.classList.add('has-file');
      } else {
        itbText.textContent = '클릭 또는 드래그하여 파일 선택';
        itbDrop.classList.remove('has-file');
      }
    });

    // ═══ 제출 ═══
    function submit() {
      if (btnSubmit.classList.contains('is-disabled')) return;
      const data = {
        type: elType(),
        status: elStatus(),
        contract: elContract.value.trim(),
        budgetCode: elBudget.value.trim(),
        name: elName.value.trim(),
        client: elClient.value.trim(),
        description: elDesc.value.trim(),
        start: elStart.value,
        end: elEnd.value,
        formType: elFormType.value,
        region: elRegion.value,
        location: elLocation.value,
        hasItb: !!elItb.files[0],
      };
      // 1번 페이지가 이 이벤트를 받아 PROJECTS 배열을 갱신하도록 sessionStorage 메시지 큐 사용
      sessionStorage.setItem('projectFormResult', JSON.stringify({ mode, editIdx, data }));
      // 완료 후 Projects Dashboard로 돌아감
      const msg = mode === 'edit' ? '프로젝트 정보가 수정되었습니다' : `'${data.name}' 프로젝트가 생성되었습니다`;
      showToast(msg);
      setTimeout(() => { location.href = 'index.html#/'; }, 600);
    }
    btnSubmit.addEventListener('click', submit);


    // ═══ Toast ═══
    const toastContainer = document.getElementById('toast-container');
    function showToast(msg) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      toastContainer.appendChild(el);
      setTimeout(() => el.remove(), 2800);
    }

    lucide.createIcons();
  </script>
<script>
  // Role 기반 탭 가시성 — 모든 페이지 공통
  (function () {
    var role = localStorage.getItem('userRole') || 'member';
    document.querySelectorAll('.hdr-tab[href*="templates"]').forEach(function (el) {
      el.style.display = (role === 'admin') ? '' : 'none';
    });
    document.querySelectorAll('.hdr-tab[href*="/bot"]').forEach(function (el) {
      el.style.display = (role === 'admin') ? 'none' : '';
    });
  })();
</script>
</body>

</html>
