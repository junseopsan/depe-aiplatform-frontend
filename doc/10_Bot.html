<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPC PE AI Platform</title>
  <link rel="icon" type="image/png" href="reference/logo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary-900: #081E3A;
      --primary-800: #0F2E57;
      --primary-700: #173F73;
      --primary-600: #1F4E91;
      --primary-500: #275DB2;
      --primary-400: #4A7BC7;
      --primary-300: #7FA2D9;
      --primary-200: #B2C7E8;
      --primary-100: #D4DFEE;
      --primary-50: #EEF2F9;
      --gray-900: #0D1117;
      --gray-800: #1C2230;
      --gray-700: #2E3A4E;
      --gray-600: #4A5568;
      --gray-500: #6B7A8F;
      --gray-400: #94A3B8;
      --gray-300: #CBD5E1;
      --gray-200: #E2E8F0;
      --gray-100: #F1F5F9;
      --gray-50: #F8FAFC;
      --success: #3A8C6E;
      --warning: #B07D3A;
      --error: #A04545;
      --info: #3A6A96;
    }

    html,
    body {
      font-family: 'IBM Plex Sans KR', sans-serif;
      color: var(--gray-700);
      background: var(--gray-100);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-width: 1100px;
      height: 100vh;
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    input,
    textarea,
    select {
      font-family: inherit;
    }

    .mono {
      font-family: 'IBM Plex Mono', monospace;
    }

    /* Top band + Header */
    .top-band {
      height: 2px;
      background: var(--primary-500);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .app-header {
      width: 100%;
      min-width: 100%;
      height: 52px;
      background: #fff;
      border-bottom: 1px solid var(--gray-200);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 24px;
      position: sticky;
      top: 2px;
      z-index: 99;
    }

    .hdr-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hdr-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hdr-logo img {
      height: 28px;
      width: auto;
      display: block;
    }

    .hdr-sysname {
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-800);
      letter-spacing: -0.01em;
    }

    .hdr-tabs {
      display: flex;
      gap: 4px;
    }

    .hdr-tab {
      height: 52px;
      display: inline-flex;
      align-items: center;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 500;
      color: var(--gray-500);
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }

    .hdr-tab:hover {
      color: var(--gray-700);
    }

    .hdr-tab.active {
      color: var(--primary-500);
      font-weight: 600;
      border-bottom-color: var(--primary-500);
    }

    .hdr-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .notif-bell {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: var(--gray-700);
      border: 1px solid transparent;
      position: relative;
      transition: background .15s, border-color .15s;
    }

    .notif-bell:hover {
      background: var(--gray-50);
      border-color: var(--gray-200);
    }

    .notif-bell svg {
      width: 16px;
      height: 16px;
    }

    .notif-bell .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--primary-500);
      color: #fff;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      line-height: 1;
    }

    .notif-bell .badge.pulse::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: var(--primary-500);
      opacity: 0.3;
      animation: notif-pulse 2s infinite;
    }

    @keyframes notif-pulse {
      0% {
        transform: scale(1);
        opacity: 0.4;
      }

      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    /* Dev role toggle (시연용) */
    .role-toggle {
      display: inline-flex;
      height: 28px;
      border: 1px solid var(--gray-300);
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
    }

    .role-toggle button {
      padding: 0 10px;
      font-size: 11px;
      font-weight: 500;
      color: var(--gray-500);
      background: #fff;
      transition: background .15s, color .15s;
    }

    .role-toggle button.is-active {
      background: var(--primary-50);
      color: var(--primary-700);
      font-weight: 600;
    }

    /* Buttons */
    .btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background .15s, border-color .15s, color .15s;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .btn i,
    .btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .btn.btn-primary {
      background: var(--primary-500);
      color: #fff;
    }

    .btn.btn-primary:hover {
      background: var(--primary-600);
    }

    .btn.btn-secondary {
      background: #fff;
      border-color: var(--gray-300);
      color: var(--gray-700);
    }

    .btn.btn-secondary:hover {
      background: var(--gray-50);
    }

    .btn:disabled,
    .btn.is-disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* Bot layout — 사이드바 + 챗 */
    .bot-shell {
      height: calc(100vh - 2px - 52px);
      display: grid;
      grid-template-columns: 280px 1fr;
      background: var(--gray-100);
    }

    /* ── Sidebar ───────────────────────────── */
    .bot-sidebar {
      background: #fff;
      border-right: 1px solid var(--gray-200);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .sidebar-head {
      padding: 16px;
      border-bottom: 1px solid var(--gray-100);
    }

    .btn-new-chat {
      width: 100%;
      height: 38px;
      border-radius: 4px;
      border: 1px solid var(--gray-300);
      background: #fff;
      color: var(--gray-700);
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }

    .btn-new-chat:hover {
      background: var(--gray-50);
      border-color: var(--primary-500);
      color: var(--primary-700);
    }

    .btn-new-chat i {
      width: 14px;
      height: 14px;
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .sidebar-group-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-500);
      padding: 12px 10px 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .chat-item {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border-radius: 4px;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      transition: background .15s;
      margin-bottom: 2px;
    }

    .chat-item:hover {
      background: var(--gray-50);
    }

    .chat-item.is-active {
      background: var(--primary-50);
    }

    .chat-item-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-800);
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-item.is-active .chat-item-title {
      color: var(--primary-700);
      font-weight: 600;
    }

    .chat-item-time {
      font-size: 11px;
      color: var(--gray-500);
      font-family: 'IBM Plex Mono', monospace;
      margin-top: 2px;
    }

    /* ── Chat area ────────────────────────── */
    .bot-chat {
      display: flex;
      flex-direction: column;
      background: var(--gray-100);
      min-width: 0;
      min-height: 0;
      height: 100%;
    }

    .chat-header {
      height: 56px;
      padding: 0 24px;
      background: #fff;
      border-bottom: 1px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .chat-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--gray-800);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-header-meta {
      font-size: 12px;
      color: var(--gray-500);
      white-space: nowrap;
    }

    .chat-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px;
    }

    .chat-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 100%;
    }

    /* empty일 때만 중앙 정렬 */
    .chat-inner:has(.empty-state) {
      justify-content: center;
      align-items: center;
    }

    /* ── Empty state ─────────────────────── */
    .empty-state {
      text-align: center;
      max-width: 520px;
    }

    .empty-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary-50);
      color: var(--primary-500);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .empty-icon i {
      width: 28px;
      height: 28px;
    }

    .empty-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--gray-800);
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 13px;
      color: var(--gray-600);
      margin-bottom: 24px;
    }

    .suggested-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      text-align: left;
    }

    .suggested-btn {
      padding: 14px 16px;
      border-radius: 4px;
      border: 1px solid var(--gray-300);
      background: #fff;
      color: var(--gray-700);
      font-size: 13px;
      line-height: 1.5;
      cursor: pointer;
      text-align: left;
      transition: border-color .15s, background .15s;
    }

    .suggested-btn:hover {
      border-color: var(--primary-500);
      background: var(--primary-50);
      color: var(--primary-700);
    }

    .suggested-btn .suggested-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    /* ── Message bubble ──────────────────── */
    .msg-row {
      display: flex;
      gap: 12px;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary-500);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 600;
    }

    .msg-avatar.bot {
      background: var(--primary-500);
    }

    .msg-avatar i {
      width: 16px;
      height: 16px;
    }

    .msg-column {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 6px;
    }

    .msg-column.align-end {
      align-items: flex-end;
    }

    .msg-bubble {
      max-width: 680px;
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: keep-all;
    }

    .msg-row.bot .msg-bubble {
      background: #fff;
      border: 1px solid var(--gray-200);
      color: var(--gray-800);
    }

    .msg-row.user .msg-bubble {
      background: var(--primary-500);
      color: #fff;
    }

    .msg-time {
      font-size: 11px;
      color: var(--gray-400);
      font-family: 'IBM Plex Mono', monospace;
      margin-top: 4px;
    }

    /* ── Citation (RAG 출처 · 텍스트 수준) ──────────────── */
    .citations {
      max-width: 680px;
      padding: 8px 14px;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: 4px;
      font-size: 12px;
      color: var(--gray-600);
      line-height: 1.55;
    }

    .citations-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .citation-line {
      font-family: 'IBM Plex Sans KR', sans-serif;
    }

    .citation-line .num {
      color: var(--primary-600);
      font-weight: 600;
      margin-right: 6px;
      font-family: 'IBM Plex Mono', monospace;
    }

    /* ── Typing indicator ────────────────── */
    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 12px 16px;
      background: #fff;
      border: 1px solid var(--gray-200);
      border-radius: 4px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gray-400);
      animation: typing-dot 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing-dot {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      30% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    /* ── Composer (하단 입력창) ──────────── */
    .chat-composer {
      flex-shrink: 0;
      background: #fff;
      border-top: 1px solid var(--gray-200);
      padding: 16px 24px 20px;
    }

    .composer-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .composer-wrap {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--gray-300);
      border-radius: 6px;
      background: #fff;
      transition: border-color .15s;
    }

    .composer-wrap:focus-within {
      border-color: var(--primary-500);
    }

    .composer-textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font-size: 14px;
      line-height: 1.5;
      color: var(--gray-800);
      max-height: 200px;
      padding: 6px 0;
      background: transparent;
      font-family: inherit;
    }

    .composer-textarea::placeholder {
      color: var(--gray-400);
    }

    .btn-send {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      background: var(--primary-500);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background .15s;
      flex-shrink: 0;
    }

    .btn-send:hover {
      background: var(--primary-600);
    }

    .btn-send.is-disabled {
      background: var(--gray-300);
      pointer-events: none;
    }

    .btn-send svg {
      width: 16px;
      height: 16px;
    }

    .composer-hint {
      font-size: 11px;
      color: var(--gray-500);
      margin-top: 8px;
      text-align: right;
    }
  </style>
</head>

<body>
  <div class="top-band"></div>

  <header class="app-header">
    <div class="hdr-left">
      <a href="index.html#/" class="hdr-logo">
        <img src="reference/logo.png" alt="EPC PE Platform">
        <span class="hdr-sysname">EPC PE AI-Platform</span>
      </a>
    </div>
    <nav class="hdr-tabs">
      <a href="index.html#/" class="hdr-tab">Projects</a>
      <a href="index.html#/templates" class="hdr-tab">Templates</a>
      <a href="index.html#/bot" class="hdr-tab active">AI Q&amp;A</a>
    </nav>
    <div class="hdr-right">
      <div class="role-toggle" aria-label="권한 전환 (시연용)">
        <button type="button" data-role="member">Member</button>
        <button type="button" data-role="admin">Admin</button>
      </div>
      <button class="notif-bell" aria-label="Notifications">
        <i data-lucide="bell"></i>
        <span class="badge pulse">3</span>
      </button>
    </div>
  </header>

  <div class="bot-shell">
    <!-- ═══ Sidebar ═══ -->
    <aside class="bot-sidebar">
      <div class="sidebar-head">
        <button type="button" class="btn-new-chat" id="btn-new-chat">새 대화</button>
      </div>
      <div class="sidebar-list" id="sidebar-list"></div>
    </aside>

    <!-- ═══ Chat area ═══ -->
    <section class="bot-chat">
      <header class="chat-header">
        <div class="chat-title" id="chat-title">새 대화</div>
      </header>

      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-inner" id="chat-inner"></div>
      </div>

      <div class="chat-composer">
        <div class="composer-inner">
          <div class="composer-wrap">
            <textarea class="composer-textarea" id="composer" rows="1" placeholder="프로젝트 문서에 대해 질문하세요"></textarea>
            <button type="button" class="btn-send is-disabled" id="btn-send" aria-label="전송">
              <i data-lucide="arrow-up"></i>
            </button>
          </div>
          <div class="composer-hint">Enter = 전송 · Shift+Enter = 줄바꿈</div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // ═══ Mock 대화 목록 ═══
    const CONVERSATIONS = [
      { id: 'c1', title: 'Saudi ARAMCO Jafurah ITB 독소조항', time: '방금', group: '오늘' },
      { id: 'c2', title: 'IRS Rev B 주요 질의 요약', time: '2시간 전', group: '오늘' },

      { id: 'c4', title: 'UAE ADNOC Hail 프로젝트 일정 문의', time: '3일 전', group: '이전 7일' },
      { id: 'c5', title: 'Design Criteria v4 목차 안내', time: '1주 전', group: '이전' },

            { n: 1, title: 'IRS Rev B', meta: '§3.1 환경 질의 · p.12' },
            { n: 2, title: 'ITB Rev B', meta: '§4.2 배출 기준 · p.45' },
            { n: 3, title: 'ARAMCO ESG Policy 2025', meta: 'v1 · p.8' },
          ]
        },
        {
          role: 'user', time: '14:24',
          text: 'VOC 허용치 차이가 얼마나 돼?'
        },
      ],
      c1: [
        {
          role: 'user', time: '15:10',
          text: 'ARAMCO Jafurah ITB에서 독소조항으로 분류된 항목을 모두 보여줘'
        },
        {
          role: 'bot', time: '15:10',
          text: '현재 ITB Rev B 기준으로 독소조항으로 AI가 분류한 항목은 **3건**입니다:\n\n• §3.2.1 무한책임 조항\n• §7.4.3 일방적 계약 해지권\n• §11.1 지적재산권 전권 양도\n\n각 조항의 상세 분석과 권고 사항은 ITB 검토 탭에서 확인하실 수 있습니다.',
          citations: [
            { n: 1, title: 'ITB Rev B', meta: '§3.2.1 · p.23' },
            { n: 2, title: 'ITB Rev B', meta: '§7.4.3 · p.87' },
            { n: 3, title: 'ITB Rev B', meta: '§11.1 · p.142' },
          ]
        },
      ],
    };

    // ═══ 상태 ═══
    let activeChatId = 'c2'; // 기본 활성 대화
    let messages = [];
    let isTyping = false;

    // ═══ DOM ═══
    const sidebarList = document.getElementById('sidebar-list');
    const chatInner = document.getElementById('chat-inner');
    const chatScroll = document.getElementById('chat-scroll');
    const chatTitle = document.getElementById('chat-title');
    const composer = document.getElementById('composer');
    const btnSend = document.getElementById('btn-send');
    const btnNewChat = document.getElementById('btn-new-chat');

    // ═══ 사이드바 렌더 ═══
    function renderSidebar() {
      const grouped = {};
      CONVERSATIONS.forEach(c => {
        (grouped[c.group] ||= []).push(c);
      });
      sidebarList.innerHTML = Object.entries(grouped).map(([group, list]) => `
        <div class="sidebar-group-label">${group}</div>
        ${list.map(c => `
          <button type="button" class="chat-item ${c.id === activeChatId ? 'is-active' : ''}" data-id="${c.id}">
            <div class="chat-item-title">${c.title}</div>
            <div class="chat-item-time">${c.time}</div>
          </button>
        `).join('')}
      `).join('');
    }

    sidebarList.addEventListener('click', (e) => {
      const item = e.target.closest('.chat-item');
      if (!item) return;
      activeChatId = item.dataset.id;
      loadConversation(activeChatId);
      renderSidebar();
    });

    // ═══ 대화 로드 ═══
    function loadConversation(id) {
      const conv = CONVERSATIONS.find(c => c.id === id);
      chatTitle.textContent = conv ? conv.title : '새 대화';
      messages = SEED_MESSAGES[id] ? [...SEED_MESSAGES[id]] : [];
      renderMessages();
    }

    // ═══ 메시지 렌더 ═══
    function renderMessages() {
      if (messages.length === 0) {
        chatInner.innerHTML = renderEmptyState();
        return;
      }
      const html = messages.map(m => renderMessage(m)).join('');
      chatInner.innerHTML = html + (isTyping ? renderTyping() : '');
      if (window.lucide) lucide.createIcons();
      scrollToBottom();
    }

    function renderMessage(m) {
      const citationLines = (m.citations || []).map(c =>
        `<div class="citation-line"><span class="num">[${c.n}]</span>${c.title} · ${c.meta}</div>`
      ).join('');
      const citationsHTML = citationLines
        ? `<div class="citations"><div class="citations-label">참조 문서</div>${citationLines}</div>`
        : '';
      const avatar = m.role === 'bot'
        ? `<div class="msg-avatar bot"><i data-lucide="bot"></i></div>`
        : '';
      const alignEnd = m.role === 'user' ? ' align-end' : '';
      return `
        <div class="msg-row ${m.role}">
          ${avatar}
          <div class="msg-column${alignEnd}">
            <div class="msg-bubble">${escapeHtml(m.text)}</div>
            ${citationsHTML}
            <div class="msg-time">${m.time}</div>
          </div>
        </div>`;
    }

    function renderTyping() {
      return `
        <div class="msg-row bot">
          <div class="msg-avatar bot"><i data-lucide="bot"></i></div>
          <div class="typing"><span></span><span></span><span></span></div>
        </div>`;
    }

    function renderEmptyState() {
      return `
        <div class="empty-state">
          <div class="empty-icon"><i data-lucide="bot"></i></div>
          <div class="empty-title">어떤 문서에 대해 질문하시겠어요?</div>
          <div class="empty-desc">프로젝트의 ITB, IRS, Design Criteria, MPS 문서를 기반으로 답변합니다.<br>답변에는 참조 문서 출처가 함께 표시됩니다.</div>
        </div>`;
    }

    // ═══ Composer ═══
    function autoGrow() {
      composer.style.height = 'auto';
      composer.style.height = Math.min(composer.scrollHeight, 200) + 'px';
    }
    function updateSendState() {
      btnSend.classList.toggle('is-disabled', composer.value.trim().length === 0);
    }
    composer.addEventListener('input', () => { autoGrow(); updateSendState(); });
    composer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    btnSend.addEventListener('click', send);

    function send() {
      const text = composer.value.trim();
      if (!text) return;
      const now = new Date();
      const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      messages.push({ role: 'user', time, text });
      composer.value = '';
      autoGrow();
      updateSendState();
      renderMessages();

      // Mock bot 응답 (1.2초 후)
      isTyping = true;
      renderMessages();
      setTimeout(() => {
        isTyping = false;
        const botTime = `${String(new Date().getHours()).padStart(2, '0')}:${String(new Date().getMinutes()).padStart(2, '0')}`;
        messages.push({
          role: 'bot', time: botTime,
          text: '요청하신 내용을 분석 중입니다. 실제 환경에서는 프로젝트 문서 인덱스를 조회해 응답과 출처를 반환합니다.',
          citations: [
            { n: 1, title: 'ITB Rev B', meta: '§4.2 · p.45' },
            { n: 2, title: 'IRS Rev B', meta: '§3.1 · p.12' },
          ]
        });
        renderMessages();
      }, 1200);
    }

    // ═══ 새 대화 ═══
    btnNewChat.addEventListener('click', () => {
      activeChatId = null;
      messages = [];
      chatTitle.textContent = '새 대화';
      renderSidebar();
      renderMessages();
      composer.focus();
    });

    // ═══ Utils ═══
    function scrollToBottom() {
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    }
    function escapeAttr(s) {
      return String(s).replace(/"/g, '&quot;');
    }

    // ═══ Role toggle ═══
    const roleButtons = document.querySelectorAll('.role-toggle button');
    function applyRole(role) {
      localStorage.setItem('userRole', role);
      roleButtons.forEach(b => b.classList.toggle('is-active', b.dataset.role === role));
      // Templates 탭 — admin 전용
      document.querySelectorAll('.hdr-tab[href*="templates"]').forEach(el => {
        el.style.display = (role === 'admin') ? '' : 'none';
      });
      // AI Q&A 탭 — member 전용
      document.querySelectorAll('.hdr-tab[href*="/bot"]').forEach(el => {
        el.style.display = (role === 'admin') ? 'none' : '';
      });
      // AI Q&A는 member 전용 화면. admin으로 전환 시 Projects로 리다이렉트
      if (role === 'admin') {
        location.href = 'index.html#/';
      }
    }
    roleButtons.forEach(b => b.addEventListener('click', () => applyRole(b.dataset.role)));
    applyRole(localStorage.getItem('userRole') || 'member');

    // ═══ 초기 ═══
    renderSidebar();
    loadConversation(activeChatId);
    lucide.createIcons();
  </script>
</body>

</html>
